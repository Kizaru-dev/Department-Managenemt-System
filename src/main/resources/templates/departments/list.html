<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Departments</title>
</head>
<body>
<h1>Departments</h1>
  <a th:href="@{/departments/new}">Add Departments</a>
  <br><br>
<table border="1">
 <thead>
 <tr>
   <th>ID</th>
   <th>Name</th>
   <th>Description</th>
     <th>Action</th>
 </tr>
 </thead>
  <tbody>
  <tr th:each="department :${departments}">
    <td th:text="${department.id}"></td>
    <td th:text="${department.name}"></td>
    <td th:text="${department.description}"></td>
      <td>
          <a th:href="@{/departments/{departmentId}/employees/new(departmentId=${department.id})}">
              Add Employee
          </a>
      </td>
  </tr>
  </tbody>
</table>

</body>
</html>
